# GitHub Pages configuration — LEDGER-D63
# Root cause: pages deploy CDN `syncing_files` hung >10 min on every deploy since
# 2026-11-06 04:52 (actions/deploy-pages timeout → artifact canceled → "Page build
# failed", duration 0). The repo's tracked surface grew to ~108 MB, of which the
# app shell needs only a few MB; 46 MB of committed test PNGs + 22 MB of the
# (public) context/ + Context information/ trees + agent docs all ride along.
# Excluding everything the SPA does not serve shrinks the deployment artifact so
# the CDN sync completes within the actions timeout.
# NOTE (D63 follow-up): the flavor UI fetches `context/generated/flavor-atlas-v1.json`
# at runtime (owner decree 2026-10-31 made context/generated public) — so the
# `context` TREE is excluded entry-by-entry while keeping `context/generated`.

exclude:
  - tests
  - scripts
  - docs
  - "Context information"
  - context/2026-05-01-2026-10-26-flavor-profile-analysis
  - context/2026-05-01-2026-10-26-flavor-profile-analysis.json
  - context/README.md
  - .github
  - node_modules
  - config
  - backup-2026-10-30
  - data/private
  - AGENT.md
  - AGENTS.md
  - CLAUDE.md
  - OPEN_CODE_HANDOVER.md
  - README_OPEN_CODE.md
  - eslint.config.mjs
  - opencode.json
  - opencode.json.example
  - package.json
  - package-lock.json
