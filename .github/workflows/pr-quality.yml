name: DietApp PR quality and browser evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate generated recipe data
        run: node scripts/sync_data_js.cjs --check
      - name: Static analysis and complexity gate
        run: npm run chore:lint
      - name: Unit, property and food-science checks
        run: npm test
      - name: Privacy gate
        run: npm run privacy
      - name: Handover contract
        run: python3 scripts/check_handover.py
      - name: Install Chromium for interaction tests
        run: npx playwright install --with-deps chromium
      - name: Locally served browser interactions
        run: npm run e2e
      - name: Staging responsive and accessibility audit
        run: npm run staging
      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dietapp-browser-audit
          if-no-files-found: warn
          path: |
            tests/screenshots/
            tests/e2e_served_report.json
            tests/staging_qa_report.json

  live-main-baseline:
    name: Independent LIVE Pages baseline (nonblocking until candidate deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax-check independent walkthrough
        run: node --check tests/live_pages_walkthrough.cjs
      - run: npx playwright install --with-deps chromium
      - name: Screenshot live current-main Pages
        continue-on-error: true
        run: node tests/live_pages_walkthrough.cjs
      - name: Upload exact live Pages evidence and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dietapp-live-pages-baseline
          if-no-files-found: warn
          path: |
            tests/screenshots/live-pages-independent/
            tests/live_pages_independent_report.json
